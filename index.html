<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Nilesh AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#f8fafc,#e0f2fe);
  min-height:100vh;
  color:#172033;
}

.app{
  width:100%;
  max-width:1000px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#f8fafc;
}

/* HEADER */
.header{
  height:70px;
  background:linear-gradient(135deg,#1d4ed8,#2563eb);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  box-shadow:0 3px 15px #0003;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:45px;
  height:45px;
  background:white;
  color:#2563eb;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:11px;
  opacity:.9;
  margin-top:3px;
}

.header-buttons{
  display:flex;
  gap:7px;
}

.header-btn{
  border:0;
  background:#ffffff22;
  color:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
}

/* STATUS */
.status{
  padding:9px 13px;
  background:white;
  border-bottom:1px solid #e2e8f0;
  font-size:13px;
  color:#475569;
}

.progress-box{
  display:none;
  height:5px;
  background:#dbeafe;
}

.progress{
  width:0%;
  height:100%;
  background:#2563eb;
  transition:.2s;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 13px 10px;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  padding:45px 15px;
}

.welcome-icon{
  font-size:55px;
  margin-bottom:12px;
}

.welcome h1{
  font-size:28px;
  color:#1d4ed8;
  margin-bottom:8px;
}

.welcome p{
  color:#64748b;
  line-height:1.6;
}

.quick{
  margin-top:22px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
}

.quick button{
  background:white;
  border:1px solid #bfdbfe;
  color:#1d4ed8;
  border-radius:20px;
  padding:10px 14px;
  cursor:pointer;
}

.message{
  display:flex;
  margin:12px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.bubble{
  max-width:85%;
  padding:13px 15px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:0 2px 7px #0000000d;
}

.user .bubble{
  background:#2563eb;
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:white;
  border:1px solid #e2e8f0;
  border-bottom-left-radius:4px;
}

/* TYPING */
.typing{
  display:flex;
  gap:4px;
  align-items:center;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#64748b;
  animation:blink 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{opacity:.2}
  40%{opacity:1}
}

/* INPUT */
.bottom{
  background:white;
  border-top:1px solid #e2e8f0;
  padding:9px;
}

.input-row{
  display:flex;
  gap:7px;
  align-items:flex-end;
}

textarea{
  flex:1;
  min-height:46px;
  max-height:130px;
  resize:none;
  border:1px solid #cbd5e1;
  border-radius:14px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

.action{
  width:46px;
  height:46px;
  border:0;
  border-radius:13px;
  cursor:pointer;
  font-size:18px;
}

.mic{
  background:#eff6ff;
  color:#1d4ed8;
}

.send{
  background:#2563eb;
  color:white;
}

.send:disabled{
  opacity:.5;
}

.footer-note{
  text-align:center;
  font-size:10px;
  color:#94a3b8;
  margin-top:5px;
}

/* MOBILE */
@media(max-width:600px){
  .app{
    height:100dvh;
  }

  .header{
    height:64px;
  }

  .title{
    font-size:17px;
  }

  .logo{
    width:40px;
    height:40px;
  }

  .header-btn{
    padding:8px;
    font-size:12px;
  }

  .bubble{
    max-width:92%;
  }

  .welcome{
    padding-top:35px;
  }

  .welcome h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="logo-area">

      <div class="logo">N</div>

      <div>
        <div class="title">Nilesh AI</div>
        <div class="online" id="onlineText">
          Local AI • No API Key
        </div>
      </div>

    </div>

    <div class="header-buttons">
      <button class="header-btn" id="clearBtn">
        🗑️
      </button>

      <button class="header-btn" id="newBtn">
        + New
      </button>
    </div>

  </header>


  <!-- STATUS -->

  <div class="status" id="status">
    Starting Nilesh AI...
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress" id="progress"></div>
  </div>


  <!-- CHAT -->

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">🤖</div>

      <h1>Nilesh AI</h1>

      <p>
        Your personal AI assistant.<br>
        Chat, learn, write, translate and code.
      </p>

      <div class="quick">

        <button data-question="Explain HTML in simple words">
          💻 Learn HTML
        </button>

        <button data-question="Write a short Hindi story">
          ✍️ Write Story
        </button>

        <button data-question="Translate Hello, how are you? into Hindi">
          🌐 Translate
        </button>

        <button data-question="Give me useful JavaScript coding tips">
          🧑‍💻 Coding
        </button>

      </div>

    </div>

  </main>


  <!-- INPUT -->

  <div class="bottom">

    <div class="input-row">

      <button class="action mic" id="micBtn">
        🎤
      </button>

      <textarea
        id="input"
        placeholder="Ask Nilesh AI anything..."
        rows="1"
      ></textarea>

      <button class="action send" id="sendBtn">
        ➤
      </button>

    </div>

    <div class="footer-note">
      Nilesh AI • Local model • API key not required
    </div>

  </div>

</div>


<script type="module">

/*
====================================================
 NILESH AI
 API KEY NOT REQUIRED
 Uses WebLLM + WebGPU
====================================================
*/

import * as webllm
from "https://esm.run/@mlc-ai/web-llm";


/*
----------------------------------------------------
 IMPORTANT
----------------------------------------------------
*/

const MODEL =
"Qwen2.5-0.5B-Instruct-q4f16_1-MLC";


/*
----------------------------------------------------
 VARIABLES
----------------------------------------------------
*/

let engine = null;

let isBusy = false;

let conversation = [];

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const sendBtn =
document.getElementById("sendBtn");

const micBtn =
document.getElementById("micBtn");

const status =
document.getElementById("status");

const progressBox =
document.getElementById("progressBox");

const progress =
document.getElementById("progress");

const welcome =
document.getElementById("welcome");

const clearBtn =
document.getElementById("clearBtn");

const newBtn =
document.getElementById("newBtn");


/*
----------------------------------------------------
 LOAD SAVED CHAT
----------------------------------------------------
*/

try{

  const saved =
  localStorage.getItem("nilesh_ai_chat");

  if(saved){

    conversation =
    JSON.parse(saved);

  }

}catch(error){

  conversation=[];

}


/*
----------------------------------------------------
 SAVE CHAT
----------------------------------------------------
*/

function saveChat(){

  try{

    localStorage.setItem(
      "nilesh_ai_chat",
      JSON.stringify(
        conversation.slice(-40)
      )
    );

  }catch(error){

    console.log(error);

  }

}


/*
----------------------------------------------------
 SHOW MESSAGE
----------------------------------------------------
*/

function showMessage(
  role,
  text,
  save=true
){

  if(welcome){

    welcome.remove();

  }

  const wrapper =
  document.createElement("div");

  wrapper.className =
  "message " +
  (role==="user"
    ? "user"
    : "ai");

  const bubble =
  document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop =
  chat.scrollHeight;


  if(save){

    conversation.push({

      role:
      role==="user"
        ? "user"
        : "assistant",

      content:text

    });

    saveChat();

  }

  return bubble;

}


/*
----------------------------------------------------
 TYPING MESSAGE
----------------------------------------------------
*/

function showTyping(){

  if(welcome){

    welcome.remove();

  }

  const wrapper =
  document.createElement("div");

  wrapper.className="message ai";

  wrapper.id="typingMessage";

  const bubble =
  document.createElement("div");

  bubble.className="bubble";

  const typing =
  document.createElement("div");

  typing.className="typing";

  typing.innerHTML=`
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  bubble.appendChild(typing);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop =
  chat.scrollHeight;

}


/*
----------------------------------------------------
 REMOVE TYPING
----------------------------------------------------
*/

function removeTyping(){

  const typing =
  document.getElementById(
    "typingMessage"
  );

  if(typing){

    typing.remove();

  }

}


/*
----------------------------------------------------
 STATUS
----------------------------------------------------
*/

function setStatus(text){

  status.textContent=text;

}


/*
----------------------------------------------------
 LOAD LOCAL AI
----------------------------------------------------
*/

async function startAI(){

  try{

    /*
    Check WebGPU
    */

    if(!("gpu" in navigator)){

      setStatus(
        "⚠️ WebGPU is not available in this browser."
      );

      showMessage(
        "assistant",
        "Nilesh AI interface is working, but this device/browser does not provide WebGPU. Try the latest Chrome with hardware acceleration enabled."
      );

      return;

    }


    progressBox.style.display="block";

    progress.style.width="0%";


    setStatus(
      "Downloading local AI model... First time only."
    );


    engine =
    await webllm.CreateMLCEngine(
      MODEL,
      {

        initProgressCallback:
        function(info){

          let value =
          Number(info.progress || 0);

          if(value>1){

            value=value/100;

          }

          value =
          Math.max(
            0,
            Math.min(
              100,
              value*100
            )
          );

          progress.style.width =
          value+"%";

          if(info.text){

            setStatus(
              info.text
            );

          }

        }

      }
    );


    progressBox.style.display="none";


    setStatus(
      "✅ Nilesh AI is ready — no API key required."
    );


    /*
    Show old conversation
    */

    if(conversation.length){

      for(
        const message
        of conversation
      ){

        showMessage(
          message.role==="user"
            ? "user"
            : "assistant",
          message.content,
          false
        );

      }

    }


  }catch(error){

    console.error(error);

    progressBox.style.display="none";

    setStatus(
      "❌ Local AI could not start."
    );

    showMessage(
      "assistant",
      "Nilesh AI could not start the local model.\n\nPossible reasons:\n• WebGPU is unavailable\n• Browser does not support the model\n• Model download failed\n• Internet connection is unavailable\n\nThe API key is NOT required."
    );

  }

}


/*
----------------------------------------------------
 ASK AI
----------------------------------------------------
*/

async function askAI(question){

  question =
  question.trim();

  if(!question){

    return;

  }

  if(isBusy){

    return;

  }


  /*
  AI not loaded
  */

  if(!engine){

    showMessage(
      "assistant",
      "Please wait. Nilesh AI is still loading its local model."
    );

    return;

  }


  isBusy=true;

  sendBtn.disabled=true;

  input.disabled=true;

  micBtn.disabled=true;


  /*
  User message
  */

  showMessage(
    "user",
    question,
    true
  );


  /*
  Typing
  */

  showTyping();


  try{

    /*
    System instruction
    */

    const systemMessage={

      role:"system",

      content:
      `You are Nilesh AI, a helpful personal AI assistant.

Rules:
1. Be polite and useful.
2. If the user speaks Hindi, answer Hindi.
3. If the user speaks English, answer English.
4. Help with coding, writing, learning, translation and general questions.
5. Give clear step-by-step instructions when useful.
6. Do not claim to have live internet access.
7. Never invent an API key.
8. Keep answers understandable.
9. For code requests, provide complete working code when practical.`

    };


    /*
    Last messages only
    */

    const messages=[
      systemMessage,
      ...conversation.slice(-14),
      {
        role:"user",
        content:question
      }
    ];


    /*
    AI request
    */

    const response =
    await engine.chat.completions.create({

      messages:messages,

      temperature:0.7,

      max_tokens:800

    });


    let answer =
    response
      ?.choices
      ?.at(0)
      ?.message
      ?.content;


    if(!answer){

      answer =
      "Sorry, I could not generate a response.";

    }


    answer =
    answer.trim();


    /*
    Remove typing
    */

    removeTyping();


    /*
    AI message
    */

    showMessage(
      "assistant",
      answer,
      true
    );


  }catch(error){

    console.error(error);

    removeTyping();

    showMessage(
      "assistant",
      "Sorry, an error occurred while generating the answer.\n\n"+(
        error?.message ||
        "Unknown error"
      )
    );

  }


  isBusy=false;

  sendBtn.disabled=false;

  input.disabled=false;

  micBtn.disabled=false;

  input.focus();

}


/*
----------------------------------------------------
 SEND BUTTON
----------------------------------------------------
*/

sendBtn.addEventListener(
  "click",
  function(){

    const question =
    input.value;

    input.value="";

    input.style.height="46px";

    askAI(question);

  }
);


/*
----------------------------------------------------
 ENTER TO SEND
 SHIFT+ENTER = NEW LINE
----------------------------------------------------
*/

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendBtn.click();

    }

  }
);


/*
----------------------------------------------------
 AUTO RESIZE TEXTAREA
----------------------------------------------------
*/

input.addEventListener(
  "input",
  function(){

    input.style.height="46px";

    input.style.height =
    Math.min(
      input.scrollHeight,
      130
    )+"px";

  }
);


/*
----------------------------------------------------
 QUICK QUESTIONS
----------------------------------------------------
*/

document
.querySelectorAll(
  ".quick button"
)
.forEach(
  function(button){

    button.addEventListener(
      "click",
      function(){

        input.value =
        button.dataset.question;

        input.dispatchEvent(
          new Event("input")
        );

        input.focus();

      }
    );

  }
);


/*
----------------------------------------------------
 CLEAR CHAT
----------------------------------------------------
*/

clearBtn.addEventListener(
  "click",
  function(){

    if(
      !confirm(
        "Clear all chat history?"
      )
    ){

      return;

    }

    conversation=[];

    localStorage.removeItem(
      "nilesh_ai_chat"
    );

    chat.innerHTML="";

    const div =
    document.createElement("div");

    div.className="welcome";

    div.innerHTML=`
      <div class="welcome-icon">🤖</div>
      <h1>Nilesh AI</h1>
      <p>Chat history cleared.<br>Ask me anything.</p>
    `;

    chat.appendChild(div);

  }
);


/*
----------------------------------------------------
 NEW CHAT
----------------------------------------------------
*/

newBtn.addEventListener(
  "click",
  function(){

    conversation=[];

    localStorage.removeItem(
      "nilesh_ai_chat"
    );

    chat.innerHTML=`
      <div class="welcome">
        <div class="welcome-icon">🤖</div>
        <h1>Nilesh AI</h1>
        <p>New conversation started.</p>
      </div>
    `;

  }
);


/*
----------------------------------------------------
 VOICE INPUT
----------------------------------------------------
*/

micBtn.addEventListener(
  "click",
  function(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

      alert(
        "Voice input is not supported in this browser."
      );

      return;

    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    "en-IN";


    recognition.interimResults=false;


    recognition.continuous=false;


    recognition.onstart=function(){

      setStatus(
        "🎤 Listening..."
      );

      micBtn.textContent="🔴";

    };


    recognition.onresult=function(event){

      const text =
      event.results[0][0].transcript;

      input.value=text;

      input.dispatchEvent(
        new Event("input")
      );

    };


    recognition.onerror=function(){

      setStatus(
        "Voice input stopped."
      );

    };


    recognition.onend=function(){

      micBtn.textContent="🎤";

      if(engine){

        setStatus(
          "✅ Nilesh AI is ready."
        );

      }

    };


    recognition.start();

  }
);


/*
----------------------------------------------------
 START
----------------------------------------------------
*/

startAI();

</script>

</body>
</html>
